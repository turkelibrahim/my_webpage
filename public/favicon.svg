<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133825"/>
      <stop offset="55%" stop-color="#0a2015"/>
      <stop offset="100%" stop-color="#05110b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#d4955a"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c68f"/>
      <stop offset="100%" stop-color="#c68346"/>
    </linearGradient>
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6efe9"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed Luxury Squircle Base -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Architectural Frame -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="none" stroke="#34d399" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Precision Corner Brackets (fill="none" prevents black triangles) -->
  <path d="M11 19V11H19" fill="none" stroke="url(#emeraldGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M53 45V53H45" fill="none" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Monogram "İT" with Shadow -->
  <g filter="url(#dropGlow)">
    <!-- "İ" Glowing AI Node Dot -->
    <circle cx="20.5" cy="15.5" r="4.3" fill="url(#emeraldGlow)"/>

    <!-- "İ" Vertical Pillar -->
    <rect x="16.5" y="23" width="8" height="25.5" rx="2.6" fill="url(#ivoryGrad)"/>

    <!-- Neural Bridge Linking İ and T -->
    <rect x="24.5" y="32.5" width="5.5" height="3" rx="1" fill="url(#goldAccent)"/>

    <!-- "T" Top Architectural Bar -->
    <rect x="28.5" y="23" width="22" height="7.5" rx="2.4" fill="url(#ivoryGrad)"/>

    <!-- "T" Vertical Pillar -->
    <rect x="35.5" y="30.5" width="8" height="18" rx="2.6" fill="url(#ivoryGrad)"/>

    <!-- Terminal Accent Node on T -->
    <circle cx="48" cy="26.75" r="1.6" fill="#0a2015"/>
  </g>
</svg>
